[build-system]
requires = ["setuptools>=68.0", "wheel>=0.41.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "quant-validation-pipeline"
version = "0.1.0"
description = "Multi-agent statistical validation pipeline with Deflated Sharpe Ratio"
requires-python = ">=3.10"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.1",
    "scipy==1.12.0",
    "scikit-learn==1.4.1",
    "lightgbm==4.3.0",
    "statsmodels==0.14.1",
    "pydantic==2.6.3",
    "pydantic-settings==2.2.1",
    "pyyaml==6.0.1",
    "structlog==24.1.0",
    "pyarrow==15.0.1",
]

[project.optional-dependencies]
deep = [
    "torch>=2.2.0",
]
notebooks = [
    "jupyter==1.0.0",
    "papermill==2.5.0",
    "jupytext==1.16.1",
    "nbstripout==0.7.1",
    "matplotlib==3.8.3",
    "seaborn==0.13.2",
]
dev = [
    "pytest==8.0.2",
    "pytest-cov==4.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
markers = [
    "calibration: long statistical canaries; run with RUN_LONG_CALIBRATION=1",
]
