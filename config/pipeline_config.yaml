# ============================================================
# Pipeline Configuration
# Todos los parametros numericos viven aqui, no hardcodeados.
# ============================================================

config_version: "2"

reproducibility:
  global_seed: 42

data:
  source: "csv"                    # "csv" | "api"
  path: "data/raw/EURUSD_15min.csv"
  symbol: "EURUSD"
  market: "forex"
  calendar: "fx_24_5"
  timezone: "UTC"
  manifest_path: "config/data_manifest.json"
  frequency: "15min"               # frecuencia de barras
  train_start: "2018-01-01"
  train_end: "2023-06-30 23:59:59"
  test_start: "2023-07-01"
  test_end: "2024-02-09 23:59:59"
  # Huecos observados en el feed Hugolemonnier; se conservan como huecos,
  # sin forward-fill ni interpolacion. Revisar si se cambia de fuente.
  allowed_gap_dates:
    - "2018-12-25"
    - "2018-12-31"
    - "2019-01-01"
    - "2019-05-24"
    - "2019-05-27"
    - "2019-12-24"
    - "2019-12-25"
    - "2019-12-31"
    - "2020-01-01"
    - "2020-08-12"
    - "2020-12-24"
    - "2020-12-31"
    - "2021-01-03"
    - "2021-04-20"
    - "2023-02-07"
    - "2023-09-25"
    - "2023-11-29"
    - "2023-12-22"
    - "2023-12-25"
    - "2023-12-29"
    - "2024-01-01"

splits:
  n_folds: 5                       # folds temporales purged/embargoed
  purge_window: 10                 # barras de purging
  embargo_window: 5                # barras de embargo

features:
  fractional_diff:
    d_range: [0.1, 0.9]
    d_step: 0.1
    threshold_adf_pvalue: 0.05     # p-valor maximo para estacionariedad
    weight_cutoff: 1.0e-5          # truncamiento de pesos FFD

models:
  baselines:
    sma_short: 20
    sma_long: 50
    ridge_alpha: 1.0
    lgbm_params:
      n_estimators: 200
      max_depth: 5
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      min_child_samples: 20
  deep:
    tcn:
      n_channels: [64, 64, 64]
      kernel_size: 3
      dropout: 0.2
    attention:
      n_heads: 4
      d_model: 64
  rl:
    enabled: false
    lookback: 64
    learning_rate: 0.0003
    gamma: 0.99
    gae_lambda: 0.95
    clip_epsilon: 0.2
    update_epochs: 4
    batch_size: 64
    entropy_coef: 0.01
    value_coef: 0.5
    max_grad_norm: 0.5
    n_epochs: 10
    spread_pips: 1.0
    slippage_pips: 0.2
    pip_size: 0.0001
    turnover_penalty: 0.0
    drawdown_penalty: 0.0

stats:
  psr_dsr:
    max_lag_autocorr: 5            # lags para Newey-West (T efectivo)
    significance_level: 0.05
  bootstrap:
    n_boot: 5000
    block_size: 50                 # >= SMA long memory (50 bars)
    confidence_level: 0.95

gate:
  min_dsr: 0.95                    # DSR minimo para GO
  require_ablation_significance: true
  max_pvalue_ablation: 0.05

ledger:
  db_path: "config/trial_ledger.db"

execution:
  platform: "mt5"
  dry_run: true                    # no enviar ordenes por defecto
  allow_live_orders: false         # requiere confirmacion adicional en codigo y entorno
  magic: 260814
  deviation_points: 20
  max_volume: 0.01                 # limite de canary; revisar con el broker

logging:
  level: "INFO"
  format: "json"
